<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한해 달력</title>
<meta name="description" content="공휴일·24절기·세시풍속과 내 구글 캘린더 일정을 한 해 단위로 한눈에">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한해 달력">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --ink:#1f2328; --ink2:#5b616b; --ink3:#9aa0a8; --line:#e7e1d8;
  --sun:#d6453d; --sat:#2f6fd0; --off:#d6453d; --memo:#8a6bb8;
  --jeol:#3f8f3a; --sesi:#c98a12; --today:#1f2328; --today-ink:#fff; --accent:#1f2328;
  --chip:#efe9e0; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16171a; --surface:#1f2125; --ink:#eceef1; --ink2:#a9afb8; --ink3:#6b717b; --line:#2e3137;
  --sun:#ff7b72; --sat:#79a8ff; --off:#ff7b72; --memo:#b79ae6; --jeol:#7fcf6f; --sesi:#f0b84a;
  --today:#eceef1; --today-ink:#16171a; --accent:#eceef1; --chip:#2a2d32; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#16171a; --surface:#1f2125; --ink:#eceef1; --ink2:#a9afb8; --ink3:#6b717b; --line:#2e3137;
  --sun:#ff7b72; --sat:#79a8ff; --off:#ff7b72; --memo:#b79ae6; --jeol:#7fcf6f; --sesi:#f0b84a;
  --today:#eceef1; --today-ink:#16171a; --accent:#eceef1; --chip:#2a2d32; --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-feature-settings:"tnum";min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* 상단 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:4px;padding:10px 0 4px}
.yr{font-size:30px;font-weight:800;letter-spacing:-.02em;min-width:92px;text-align:center}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--chip)} .ib svg{width:20px;height:20px}
.ib.spin svg{animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.sp{flex:1}
.tbtn{height:32px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);padding:2px 0 8px}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.next{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.nx{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center}
.nx b{font-weight:700} .nx .dd{color:var(--ink3);font-weight:600}
.tabs{display:flex;gap:2px;background:var(--chip);border-radius:10px;padding:3px;width:max-content}
.tab{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.row3{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink2);background:var(--surface)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.4;background:none}

/* 한눈에 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:16px 0 40px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:20px 16px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr);gap:24px 20px}}
.mo{container-type:inline-size;min-width:0}
.mh{display:flex;align-items:baseline;gap:6px;padding:0 2px 4px;font-weight:800;font-size:15px}
.mh small{font-size:10.5px;font-weight:600;color:var(--ink3)}
.mh.cur{color:var(--accent)} .mh.cur::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--sun);align-self:center}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.wk span{font-size:8.5px;text-align:center;color:var(--ink3);padding-bottom:2px}
.wk span:first-child{color:var(--sun)} .wk span:last-child{color:var(--sat)}
.d{position:relative;aspect-ratio:1/1.12;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:1px;border-radius:5px;min-width:0}
.d:hover{background:var(--chip)}
.n{font-size:9.5px;font-weight:600;line-height:1;width:15px;height:15px;display:grid;place-items:center;border-radius:50%}
.d.sun .n,.d.off .n{color:var(--sun)} .d.sat .n{color:var(--sat)}
.d.past{opacity:.42}
.d.today .n{background:var(--today);color:var(--today-ink)!important}
.d.jeol .n{box-shadow:inset 0 -2px 0 var(--jeol);border-radius:3px}
.d.sesi .n{box-shadow:inset 0 -2px 0 var(--sesi);border-radius:3px}
.d.today.jeol .n,.d.today.sesi .n{border-radius:50%}
.dots{display:flex;gap:1.5px;margin-top:2px;height:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--c)}
.lbl{display:none}
@container (min-width:200px){
  .n{font-size:11px;width:18px;height:18px} .wk span{font-size:10px} .mh{font-size:17px}
  .dots i{width:5px;height:5px} .dots{height:5px}
}
@container (min-width:250px){
  .d{aspect-ratio:auto;height:46px}
  .lbl{display:block;font-size:8.5px;line-height:1.15;margin-top:2px;max-width:100%;padding:0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
  .lbl.off{color:var(--sun);font-weight:600} .lbl.jeol{color:var(--jeol);font-weight:600} .lbl.sesi{color:var(--sesi);font-weight:600}
  .lbl.memo{color:var(--memo)}
}

/* 목록 */
.list{padding:8px 0 60px;max-width:720px}
.lm{font-weight:800;font-size:18px;padding:22px 0 8px;position:sticky;top:var(--toph,0);background:var(--bg)}
.li{display:flex;gap:12px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li.past{opacity:.45}
.li.today{background:var(--surface);border-radius:10px;border-bottom-color:transparent}
.ld{width:44px;flex:none;display:flex;align-items:baseline;gap:4px}
.ld b{font-size:17px;font-weight:700} .ld small{font-size:11px;color:var(--ink3)}
.ld.sun b,.ld.off b{color:var(--sun)} .ld.sat b{color:var(--sat)}
.lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.it{display:flex;gap:7px;align-items:center;font-size:14px;line-height:1.35}
.it .k{flex:none;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff;background:var(--c)}
.it .tm{color:var(--ink3);font-size:12px;flex:none}
.it .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{font-size:12.5px;font-weight:800;padding:20px 0 6px;color:var(--ink2)}
.tg.late{color:var(--sun)}
.td{display:flex;align-items:baseline;gap:8px;padding:14px 0 6px;border-bottom:1px solid var(--line)}
.td b{font-size:16px;font-weight:800} .td small{font-size:12px;color:var(--ink3)} .td .dd{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink2)}
.td.sun b{color:var(--sun)} .td.sat b{color:var(--sat)} .td.now .dd{color:var(--sun)}
.tk{display:flex;gap:9px;align-items:center;padding:8px 2px;font-size:14.5px}
.tk .k{flex:none;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff;background:var(--c)}
.tk .bx{flex:none;width:16px;height:16px;border-radius:5px;border:1.6px solid var(--ink3);display:grid;place-items:center}
.tk.done{color:var(--ink3)} .tk.done .tx{text-decoration:line-through}
.tk.done .bx{background:var(--ink3);border-color:var(--ink3)} .tk.done .bx::after{content:"";width:6px;height:3px;border:2px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.more{margin:18px 0 0;height:36px;padding:0 14px;border-radius:10px;background:var(--chip);font-size:13px;font-weight:600}
.empty{color:var(--ink3);font-size:14px;padding:40px 0;text-align:center}

/* 하루 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:75dvh;overflow:auto;
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sh h2{font-size:21px;font-weight:800}
.sh .lun{font-size:12.5px;color:var(--ink3)} .sh .rel{font-size:12.5px;font-weight:700;color:var(--ink2);margin-left:auto}
.sl{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.si{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.si .cb{width:4px;border-radius:4px;background:var(--c);flex:none}
.si .k{font-size:11px;font-weight:700;color:var(--c)}
.si .t{font-size:15.5px;font-weight:600;margin-top:1px}
.si .x{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45;white-space:pre-line}

/* 잠금 */
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.35);padding:16px}
.modal.on{display:grid}
.box{background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:360px}
.box h3{font-size:17px;font-weight:800} .box p{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5}
.box input{width:100%;margin-top:14px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:15px}
.box .err{color:var(--sun);font-size:12.5px;min-height:18px;margin-top:6px}
.box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{height:40px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--chip)}
.btn.pri{background:var(--accent);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{font-size:11.5px;color:var(--ink3);padding:0 0 30px;line-height:1.6}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap">
  <div class="row1">
    <button class="ib" id="prev" aria-label="이전 해"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 class="yr" id="yr">2026</h1>
    <button class="ib" id="next" aria-label="다음 해"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="sp"></span>
    <button class="tbtn" id="todayBtn">오늘</button>
    <button class="ib" id="refresh" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
    <button class="ib" id="lock" aria-label="내 일정 잠금"></button>
  </div>
  <div class="prog" id="prog"></div>
  <div class="next" id="nexts"></div>
  <div class="row3">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tGrid" aria-selected="true">한눈에</button>
      <button class="tab" role="tab" id="tList" aria-selected="false">목록</button>
      <button class="tab" role="tab" id="tTask" aria-selected="false">마감</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div></header>

<main class="wrap">
  <section class="grid" id="grid"></section>
  <section class="list" id="list" hidden></section>
  <section class="list" id="tasks" hidden></section>
  <p class="foot" id="foot"></p>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mTitle">내 일정 열기</h3>
  <p id="mText">구글 캘린더 일정은 암호로 잠겨 있어요. 비밀 문구를 한 번만 넣으면 이 기기에서 계속 보여요.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="비밀 문구">
  <div class="err" id="err"></div>
  <div class="acts"><button class="btn" id="mCancel">닫기</button><button class="btn pri" id="mOk">열기</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const KEY_LS="yearcal_key", FILTER_LS="yearcal_filter";
const WD="일월화수목금토";
const KIND={off:{l:"공휴일",c:"var(--off)"},memo:{l:"기념일",c:"var(--memo)"},jeol:{l:"절기",c:"var(--jeol)"},sesi:{l:"세시",c:"var(--sesi)"}};
// 구글 일정 색 → 분류 (calendar-capture 규칙)
const CAT={"10":["생글즈","#0b8043"],"7":["모임","#039be5"],"9":["강의","#3f51b5"],"1":["건강","#7986cb"],"6":["개인","#f4511e"],
  "5":["남자친구","#f6bf26"],"2":["가족","#33b679"],"4":["생일·기념일","#e67c73"],"11":["중요","#d50000"],"3":["기타","#8e24aa"],"8":["완료","#9e9e9e"],"0":["기본","#4fb8c4"]};

const TL_COL=["#c2410c","#0b8043","#3f51b5","#b45309","#8e24aa","#039be5","#d50000","#616161"];
const tlCol=l=>{let h=0;for(const ch of l)h=(h*31+ch.charCodeAt(0))>>>0;return TL_COL[h%TL_COL.length]};
let showDone=false;
let pub=null, prv=null, meta=null, key=null, idx={}, year, view="grid";
let filt={off:1,memo:1,jeol:1,sesi:1,me:1};
try{Object.assign(filt,JSON.parse(localStorage.getItem(FILTER_LS)||"{}"))}catch(e){}
try{key=localStorage.getItem(KEY_LS)}catch(e){}
if(location.hash.startsWith("#k=")){key=decodeURIComponent(location.hash.slice(3));try{localStorage.setItem(KEY_LS,key)}catch(e){}history.replaceState(null,"",location.pathname)}

const pad=n=>String(n).padStart(2,"0");
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800)}

async function getJSON(u){const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function decrypt(b,pass){
  const bin=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), te=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",te.encode(pass),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bin(b.salt),iterations:b.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:bin(b.iv)},k,bin(b.ct))));
}

function buildIndex(){
  idx={};
  const add=(d,o)=>(idx[d]||(idx[d]=[])).push(o);
  for(const h of pub.holidays) add(h.d,{k:h.off?"off":"memo",s:h.s});
  for(const s of pub.seasonal){
    let x=s.x;
    if(s.t){const[h,m]=s.t.split(":").map(Number);x=`${s.h} · 절입 ${h<12?"오전":"오후"} ${h%12||12}:${pad(m)}\n${s.x}`}
    add(s.d,{k:s.k==="절기"?"jeol":"sesi",s:s.s,x});
  }
  if(prv) for(const e of prv.events){
    let d=pd(e.d); const end=pd(e.e||e.d), multi=!!e.e;
    for(let i=0;d<=end&&i<370;i++,d.setDate(d.getDate()+1)) add(ds(d),{k:"me",c:e.c,s:e.s,t:i===0?e.t:null,multi,from:e.d,to:e.e});
  }
  const ord={off:0,memo:1,jeol:2,sesi:3,me:4};
  for(const d in idx) idx[d].sort((a,b)=>ord[a.k]-ord[b.k]||(a.t||"").localeCompare(b.t||""));
}
const shown=it=>it.k==="me"?filt.me&&filt["c"+it.c]!==0:filt[it.k];
const items=d=>(idx[d]||[]).filter(shown);
function lunar(d){const y=d.getFullYear(),a=pub&&pub.lunar[y];if(!a)return"";const doy=Math.round((d-new Date(y,0,1))/864e5);return a[doy]||""}

function renderChips(){
  let h="";
  if(view==="tasks"){
    if(prv&&prv.tasks){for(const l of [...new Set(prv.tasks.map(t=>t.l))])h+=`<button class="chip" data-f="t:${esc(l)}" aria-pressed="${filt["t:"+l]!==0}" style="--c:${tlCol(l)}"><i></i>${esc(l)}</button>`}
    $("#chips").innerHTML=h;return;
  }
  for(const k of ["off","memo","jeol","sesi"]) h+=`<button class="chip" data-f="${k}" aria-pressed="${!!filt[k]}" style="--c:${KIND[k].c}"><i></i>${KIND[k].l}</button>`;
  if(prv){
    const used=new Set(prv.events.map(e=>e.c));
    h+=`<button class="chip" data-f="me" aria-pressed="${!!filt.me}" style="--c:var(--ink2)"><i></i>내 일정</button>`;
    if(filt.me) for(const c of Object.keys(CAT)) if(used.has(c)) h+=`<button class="chip" data-f="c${c}" aria-pressed="${filt["c"+c]!==0}" style="--c:${CAT[c][1]}"><i></i>${CAT[c][0]}</button>`;
  }
  $("#chips").innerHTML=h;
}
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const f=b.dataset.f;
  filt[f]=(f.startsWith("c")||f.startsWith("t:"))?(filt[f]===0?1:0):(filt[f]?0:1);
  try{localStorage.setItem(FILTER_LS,JSON.stringify(filt))}catch(e){}renderAll()};

function renderHead(){
  $("#yr").textContent=year;
  const t=today(), y=t.getFullYear(), days=(new Date(year+1,0,1)-new Date(year,0,1))/864e5;
  if(year===y){const n=Math.round((t-new Date(y,0,1))/864e5)+1;
    $("#prog").innerHTML=`<span><b>${n}</b>일째 · ${Math.round(n/days*100)}%</span><span class="bar"><i style="width:${n/days*100}%"></i></span><span>남은 ${days-n}일</span>`}
  else $("#prog").innerHTML=`<span>${year}년 · ${days}일 · ${year<y?"지난 해":`${dayDiff(ds(t),year+"-01-01")}일 뒤 시작`}</span>`;
  // 다음 쉬는 날 · 다음 절기 · 다음 내 일정
  const nexts=[], tdy=ds(t);
  const find=(fn)=>{const ks=Object.keys(idx).filter(d=>d>=tdy).sort();for(const d of ks){const it=idx[d].find(fn);if(it)return[d,it]}return null};
  const fmt=(lab,r)=>{if(!r)return"";const[d,it]=r,dd=dayDiff(tdy,d),dt=pd(d);
    return `<button class="nx" data-d="${d}"><span>${lab}</span><b>${esc(it.s)}</b><span>${dt.getMonth()+1}/${dt.getDate()}(${WD[dt.getDay()]})</span><span class="dd">${dd?"D-"+dd:"오늘"}</span></button>`};
  if(pub){nexts.push(fmt("쉬는 날",find(i=>i.k==="off")),fmt("절기",find(i=>i.k==="jeol")));
    if(prv&&filt.me)nexts.push(fmt("내 일정",find(i=>i.k==="me"&&shown(i))));
    const nt=prv&&prv.tasks&&prv.tasks.find(t=>!t.done&&t.d>=tdy);
    if(nt){const dd=dayDiff(tdy,nt.d),dt=pd(nt.d);nexts.push(`<button class="nx" id="nxTask"><span>마감</span><b>${esc(nt.s)}</b><span>${dt.getMonth()+1}/${dt.getDate()}(${WD[dt.getDay()]})</span><span class="dd">${dd?"D-"+dd:"오늘"}</span></button>`)}}
  $("#nexts").innerHTML=nexts.join("");
  $("#lock").innerHTML=prv?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  $("#lock").setAttribute("aria-label",prv?"내 일정 잠그기":"내 일정 열기");
}

function renderGrid(){
  const t=ds(today()); let h="";
  for(let m=0;m<12;m++){
    const first=new Date(year,m,1), n=new Date(year,m+1,0).getDate();
    const cur=year===today().getFullYear()&&m===today().getMonth();
    let c=`<div class="mo"><button class="mh${cur?" cur":""}" data-m="${m}">${m+1}월<small>${cnt(m)}</small></button><div class="wk">${[...WD].map(w=>`<span>${w}</span>`).join("")}</div><div class="days">`;
    for(let i=0;i<first.getDay();i++) c+="<span></span>";
    for(let d=1;d<=n;d++){
      const dt=new Date(year,m,d), s=ds(dt), its=items(s), w=dt.getDay();
      const cls=["d"]; if(w===0)cls.push("sun"); if(w===6)cls.push("sat");
      if(its.some(i=>i.k==="off"))cls.push("off"); if(its.some(i=>i.k==="jeol"))cls.push("jeol"); else if(its.some(i=>i.k==="sesi"))cls.push("sesi");
      if(s<t)cls.push("past"); if(s===t)cls.push("today");
      const me=its.filter(i=>i.k==="me"), col=[...new Set(me.map(i=>CAT[i.c]?CAT[i.c][1]:CAT["0"][1]))].slice(0,3);
      if(its.some(i=>i.k==="memo")&&col.length<3)col.unshift("var(--memo)");
      const lb=its[0]; const lbl=lb?`<span class="lbl ${lb.k}">${esc(lb.s)}</span>`:"";
      c+=`<button class="${cls.join(" ")}" data-d="${s}" aria-label="${m+1}월 ${d}일 ${its.map(i=>i.s).join(", ")}"><span class="n">${d}</span><span class="dots">${col.map(x=>`<i style="--c:${x}"></i>`).join("")}</span>${lbl}</button>`;
    }
    h+=c+"</div></div>";
  }
  $("#grid").innerHTML=h;
}
function cnt(m){if(!prv||!filt.me)return"";let k=0;const n=new Date(year,m+1,0).getDate();
  for(let d=1;d<=n;d++){const s=ds(new Date(year,m,d));k+=items(s).filter(i=>i.k==="me"&&(!i.multi||i.from===s)).length}return k?k+"건":""}

function itemLine(it){
  const c=it.k==="me"?(CAT[it.c]||CAT["0"])[1]:KIND[it.k].c, l=it.k==="me"?(CAT[it.c]||CAT["0"])[0]:KIND[it.k].l;
  return `<span class="it"><span class="k" style="--c:${c}">${l}</span>${it.t?`<span class="tm">${it.t}</span>`:""}<span class="tx">${esc(it.s)}</span></span>`;
}
function renderList(){
  const t=ds(today()); let h="", any=false;
  for(let m=0;m<12;m++){
    let rows=""; const n=new Date(year,m+1,0).getDate();
    for(let d=1;d<=n;d++){
      const dt=new Date(year,m,d), s=ds(dt), its=items(s).filter(i=>!(i.k==="me"&&i.multi&&i.from!==s&&d!==1));
      if(!its.length&&s!==t)continue;
      const w=dt.getDay(), off=its.some(i=>i.k==="off");
      rows+=`<button class="li${s<t?" past":""}${s===t?" today":""}" data-d="${s}" ${s===t?'id="todayRow"':""}><span class="ld ${w===0?"sun":w===6?"sat":""} ${off?"off":""}"><b>${d}</b><small>${WD[w]}</small></span><span class="lt">${its.length?its.map(itemLine).join(""):'<span class="it"><span class="tx" style="color:var(--ink3)">오늘</span></span>'}</span></button>`;
    }
    if(rows){any=true;h+=`<h3 class="lm" id="lm${m}">${m+1}월</h3>${rows}`}
  }
  $("#list").innerHTML=any?h:'<p class="empty">표시할 항목이 없어요</p>';
}

function renderTasks(){
  if(!prv||!prv.tasks){$("#tasks").innerHTML='<p class="empty">자물쇠를 눌러 내 일정을 열면 구글 태스크 마감이 보여요</p>';return}
  const t=ds(today()), ts=prv.tasks.filter(x=>filt["t:"+x.l]!==0);
  const late=ts.filter(x=>!x.done&&x.d<t), up=ts.filter(x=>x.d>=t), past=ts.filter(x=>x.done&&x.d<t).reverse();
  const row=x=>`<div class="tk${x.done?" done":""}"><span class="bx"></span><span class="k" style="--c:${tlCol(x.l)}">${esc(x.l)}</span><span class="tx">${esc(x.s)}</span></div>`;
  const group=(arr)=>{let h="",cur="";for(const x of arr){if(x.d!==cur){cur=x.d;const d=pd(x.d),w=d.getDay(),dd=dayDiff(t,x.d);
    h+=`<div class="td ${w===0?"sun":w===6?"sat":""} ${dd>=0&&dd<=3?"now":""}"><b>${d.getMonth()+1}월 ${d.getDate()}일</b><small>${WD[w]} · ${d.getFullYear()}</small><span class="dd">${dd===0?"오늘":dd>0?"D-"+dd:-dd+"일 지남"}</span></div>`}h+=row(x)}return h};
  let h="";
  if(late.length)h+=`<h3 class="tg late">밀린 마감 ${late.length}</h3>`+group(late);
  h+=`<h3 class="tg">다가오는 마감 ${up.filter(x=>!x.done).length}</h3>`+(up.length?group(up):'<p class="empty">남은 마감이 없어요</p>');
  h+=`<button class="more" id="doneBtn">${showDone?"지난 완료 숨기기":`지난 완료 보기 (${past.length})`}</button>`;
  if(showDone)h+=group(past);
  $("#tasks").innerHTML=h;
}
document.addEventListener("click",e=>{if(e.target.closest("#doneBtn")){showDone=!showDone;renderTasks()}if(e.target.closest("#nxTask"))setView("tasks")});

function openDay(s){
  const d=pd(s), its=items(s), dd=dayDiff(ds(today()),s);
  const rel=dd===0?"오늘":dd>0?`D-${dd}`:`${-dd}일 전`;
  let h=`<div class="sh"><h2>${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일</h2><span class="lun">${d.getFullYear()} · 음력 ${lunar(d)}</span><span class="rel">${rel}</span></div><div class="sl">`;
  if(!its.length)h+=`<div class="si"><div><div class="x">${prv?"일정이 없어요":"공휴일·절기 없음 · 내 일정은 자물쇠를 눌러 열어요"}</div></div></div>`;
  for(const it of its){
    const me=it.k==="me", cat=me?(CAT[it.c]||CAT["0"]):null, c=me?cat[1]:KIND[it.k].c;
    let x=it.x||""; if(me&&it.multi){const a=pd(it.from),b=pd(it.to);x=`${a.getMonth()+1}/${a.getDate()} ~ ${b.getMonth()+1}/${b.getDate()}`}
    h+=`<div class="si" style="--c:${c}"><span class="cb"></span><div><div class="k">${me?cat[0]:KIND[it.k].l}${it.t?" · "+it.t:""}</div><div class="t">${esc(it.s)}</div>${x?`<div class="x">${esc(x)}</div>`:""}</div></div>`;
  }
  $("#sheetBody").innerHTML=h+"</div>";
  $("#sheet").classList.add("on");$("#scrim").classList.add("on");
}
function closeDay(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
$("#scrim").onclick=closeDay;
document.addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b&&!b.closest(".sheet")){openDay(b.dataset.d);return}
  const mh=e.target.closest(".mh");if(mh){setView("list");requestAnimationFrame(()=>{const el=$("#lm"+mh.dataset.m);if(el)scrollTo({top:el.offsetTop-$("#top").offsetHeight+4,behavior:"smooth"})})}});

function renderAll(){
  if(!pub)return; renderChips(); renderHead();
  if(view==="grid")renderGrid(); else if(view==="list")renderList(); else renderTasks();
  $("#foot").innerHTML=`공휴일: 구글 「대한민국의 휴일」 · 절기: 태양 황경 계산(한국 표준시) · 세시: 음력 기준`+(meta?`<br>마지막 동기화 ${new Date(meta.updated).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`+(prv?` · 내 일정 ${prv.events.length}건`:" · 내 일정 잠김"):"");
  document.documentElement.style.setProperty("--toph",$("#top").offsetHeight+"px");
}
function setView(v){view=v;for(const[id,k]of[["tGrid","grid"],["tList","list"],["tTask","tasks"]])$("#"+id).setAttribute("aria-selected",v===k);
  $("#grid").hidden=v!=="grid";$("#list").hidden=v!=="list";$("#tasks").hidden=v!=="tasks";renderAll();if(v==="tasks")scrollTo({top:0})}
$("#tTask").onclick=()=>setView("tasks");
$("#tGrid").onclick=()=>setView("grid");
$("#tList").onclick=()=>{setView("list");if(year===today().getFullYear())requestAnimationFrame(()=>{const r=$("#todayRow");if(r)scrollTo({top:r.offsetTop-$("#top").offsetHeight-70})})};
function setYear(y){const[a,b]=pub?pub.range:[2025,2030];if(y<a||y>b){toast(`${a}~${b}년만 볼 수 있어요`);return}year=y;renderAll();scrollTo({top:0})}
$("#prev").onclick=()=>setYear(year-1);$("#next").onclick=()=>setYear(year+1);
$("#todayBtn").onclick=()=>{setYear(today().getFullYear());openDay(ds(today()))};
addEventListener("keydown",e=>{if($("#modal").classList.contains("on"))return;if(e.key==="ArrowLeft")setYear(year-1);if(e.key==="ArrowRight")setYear(year+1);if(e.key==="Escape")closeDay()});
let sx=null,sy=0;$("#grid").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("#grid").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2)setYear(year+(dx<0?1:-1))});

// 잠금
function openModal(){$("#err").textContent="";$("#pass").value="";$("#modal").classList.add("on");setTimeout(()=>$("#pass").focus(),50)}
$("#mCancel").onclick=()=>$("#modal").classList.remove("on");
$("#mOk").onclick=unlock;$("#pass").onkeydown=e=>{if(e.key==="Enter")unlock()};
async function unlock(){
  const p=$("#pass").value.trim();if(!p)return;$("#err").textContent="여는 중…";
  try{const blob=await getJSON("data/private.json");prv=await decrypt(blob,p);key=p;try{localStorage.setItem(KEY_LS,p)}catch(e){}
    $("#modal").classList.remove("on");buildIndex();renderAll();toast(`내 일정 ${prv.events.length}건을 열었어요`)}
  catch(e){$("#err").textContent="문구가 맞지 않아요"}
}
$("#lock").onclick=()=>{if(prv){prv=null;key=null;try{localStorage.removeItem(KEY_LS)}catch(e){}buildIndex();renderAll();toast("이 기기에서 내 일정을 잠갔어요")}else openModal()};

// 데이터
let loading=false;
async function load(manual){
  if(loading)return;loading=true;$("#refresh").classList.add("spin");
  try{
    const m=await getJSON("data/meta.json"), changed=!meta||m.updated!==meta.updated;
    if(changed||!pub){pub=await getJSON("data/public.json");
      if(key){try{prv=await decrypt(await getJSON("data/private.json"),key)}catch(e){prv=null;key=null;try{localStorage.removeItem(KEY_LS)}catch(_){};toast("비밀 문구가 바뀌었어요. 다시 열어 주세요")}}
      if(meta&&changed)toast("새 일정이 반영됐어요");
      meta=m;buildIndex();renderAll();
    }else if(manual)toast("이미 최신이에요");
  }catch(e){if(!pub)$("#grid").innerHTML='<p class="empty">불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>';else if(manual)toast("인터넷 연결을 확인해 주세요")}
  loading=false;$("#refresh").classList.remove("spin");
}
$("#refresh").onclick=()=>load(true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
setInterval(()=>{if(!document.hidden)load()},5*60*1000);
year=today().getFullYear();
// 자정 지나면 오늘 표시 갱신
let lastDay=ds(today());setInterval(()=>{if(ds(today())!==lastDay){lastDay=ds(today());renderAll()}},60*1000);
load();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
